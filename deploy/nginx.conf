# /etc/nginx/sites-available/smart-mis
# Replace mis.example.com with your domain. Certbot adds the HTTPS (443) block for you.
server {
    listen 80;
    listen [::]:80;
    server_name mis.example.com;

    # Uploads are limited to 10 MB by the app; allow a little overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    server_tokens off;
}
