services:
  smart-mis:
    build: .
    image: smart-mis:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:./data/smart-mis.db
      UPLOAD_DIR: ./uploads
      BACKUP_DIR: ./backups
    # Only reachable from the host itself; put Nginx (with HTTPS) in front.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - smis-data:/app/server/data
      - smis-uploads:/app/server/uploads
      - smis-backups:/app/server/backups

volumes:
  smis-data:
  smis-uploads:
  smis-backups:
